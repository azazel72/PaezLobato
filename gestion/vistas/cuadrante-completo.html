<section class="cc-view" aria-label="Cuadrante">
  <div class="cc-toolbar">
    <div class="cc-navigation">
      <button type="button" class="icon-button" data-cc-action="previous" title="Semana anterior" aria-label="Semana anterior"><i class="bi bi-chevron-left"></i></button>
      <label>Semana<input type="date" data-cc="date" aria-label="Fecha de la semana" required></label>
      <button type="button" class="icon-button" data-cc-action="next" title="Semana siguiente" aria-label="Semana siguiente"><i class="bi bi-chevron-right"></i></button>
      <button type="button" class="icon-button" data-cc-action="refresh" title="Consultar / Actualizar semana" aria-label="Consultar / Actualizar semana"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
    <div class="cc-actions">
      <button type="button" class="icon-button" data-cc-action="assign" title="Asignar empleado mediante formulario" aria-label="Asignar empleado mediante formulario"><i class="bi bi-person-plus"></i></button>
      <button type="button" class="icon-button" data-cc-action="clone" title="Clonar un día" aria-label="Clonar un día"><i class="bi bi-copy"></i></button>
      <button type="button" class="icon-button" data-cc-action="extend" title="Extender jueves y rotar batideros" aria-label="Extender jueves y rotar batideros"><i class="bi bi-calendar2-range"></i></button>
      <button type="button" class="icon-button" data-cc-action="lock" aria-pressed="false" title="Desbloquear edición en tabla" aria-label="Desbloquear edición en tabla"><i class="bi bi-lock-fill"></i></button>
      <button type="button" class="icon-button" data-cc-action="clear" title="Limpiar toda la semana" aria-label="Limpiar toda la semana"><i class="bi bi-trash"></i></button>
      <button type="button" class="icon-button" data-cc-action="xls" title="Exportar Excel (.xls)" aria-label="Exportar Excel (.xls)"><i class="bi bi-file-earmark-excel"></i></button>
      <button type="button" class="icon-button" data-cc-action="pdf" title="Exportar PDF" aria-label="Exportar PDF"><i class="bi bi-filetype-pdf"></i></button>
      <button type="button" class="icon-button" data-cc-action="csv" title="Exportar CSV" aria-label="Exportar CSV"><i class="bi bi-filetype-csv"></i></button>
      <button type="button" class="icon-button" data-cc-action="print" title="Imprimir / Guardar PDF" aria-label="Imprimir / Guardar PDF"><i class="bi bi-printer"></i></button>
    </div>
  </div>
  <div class="cc-preferences">
    <label><input type="checkbox" data-cc="uniform-color">Mismo color</label>
    <label><input type="checkbox" data-cc="uniform-width">Mismo ancho</label>
    <label><input type="checkbox" data-cc="absences">Ver faltas</label>
    <span data-cc="week-title"></span>
  </div>
  <div class="cc-layout">
    <aside class="cc-pool" data-cc="pool-zone" aria-label="Empleados. Arrastra aquí una asignación para quitarla">
      <div class="cc-pool-heading"><strong>Empleados</strong><span data-cc="pool-count"></span></div>
      <input type="search" data-cc="people-search" placeholder="Buscar empleado o código…" aria-label="Buscar empleado o código">
      <p class="cc-pool-help">Arrastra al cuadrante para asignar. Devuelve aquí una ficha para quitarla.</p>
      <div class="cc-people" data-cc="people"></div>
    </aside>
    <div class="cc-pool-resizer" title="Arrastrar para ajustar la columna de empleados" aria-label="Anchura de la columna de empleados"></div>
    <div class="cc-board" data-cc="board"><table class="cc-table"><thead></thead><tbody></tbody></table></div>
  </div>
  <footer class="window-footer">
    <span data-cc="count"></span><span class="table-hint" data-cc="hint">Edición en tabla bloqueada · Asignar usuario mediante formulario</span>
    <span class="footer-status"><span data-cc="status" role="status">Cargando…</span><span class="last-updated"></span></span>
  </footer>
</section>
